<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <rect width="860" height="520" fill="#ffffff"/>
  <text x="60" y="60" font-size="22" font-weight="700" fill="#1e2a44">两条路线，互不打架</text>
  <text x="60" y="88" font-size="14" fill="#66708a">平台录播走「抽音频 → 转写」拿文本；网盘视频走「网盘 AI」拿 PPT / 讲稿 / 笔记。</text>
  <!-- 路线 A -->
  <rect x="60" y="116" width="740" height="150" rx="14" fill="#f7f9fc" stroke="#dfe5ef"/>
  <rect x="60" y="116" width="110" height="150" rx="14" fill="#e8effc"/>
  <rect x="60" y="116" width="110" height="14" rx="7" fill="#2f5fb8"/>
