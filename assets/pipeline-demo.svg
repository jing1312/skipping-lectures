<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4277"/>
      <stop offset="1" stop-color="#4a7bd6"/>
    </linearGradient>
  </defs>
  <rect width="880" height="400" fill="#ffffff"/>
  <text x="60" y="62" font-size="22" font-weight="700" fill="#1e2a44">两条路线，互不打架</text>
  <text x="60" y="92" font-size="14" fill="#66708a">平台录播走「抽音频 → 转写」拿文本；网盘视频走「网盘 AI」拿 PPT / 讲稿 / 笔记。</text>
  <!-- 路线 A -->
  <rect x="60" y="140" width="130" height="56" rx="12" fill="url(#accent)"/>
  <text x="125" y="168" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A 转写为主</text>
  <text x="125" y="186" font-size="11" fill="#cfe0ff" text-anchor="middle">省空间</text>
  <g font-size="13" fill="#333b4d">
    <rect x="210" y="140" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="265" y="168" text-anchor="middle">平台录播</text><text x="265" y="185" font-size="10.5" fill="#8a94a6" text-anchor="middle">香樟云课堂</text>
    <rect x="340" y="140" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="395" y="168" text-anchor="middle">抽音频</text><text x="395" y="185" font-size="10.5" fill="#8a94a6" text-anchor="middle">&lt;100MB/节</text>
    <rect x="470" y="140" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="525" y="168" text-anchor="middle">ASR 转写</text><text x="525" y="185" font-size="10.5" fill="#8a94a6" text-anchor="middle">火山 · MiMo</text>
  </g>
  <rect x="600" y="140" width="130" height="56" rx="12" fill="url(#accent)"/>
  <text x="665" y="168" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">每节一份 txt</text>
  <text x="665" y="185" font-size="10.5" fill="#cfe0ff" text-anchor="middle">带时间戳</text>
  <g stroke="#8a94a6" stroke-width="1.6" fill="none">
    <path d="M 324 168 L 332 168"/>
    <path d="M 454 168 L 462 168"/>
    <path d="M 584 168 L 592 168"/>
  </g>
  <g fill="#8a94a6">
    <path d="M 332 163 L 332 173 L 340 168 Z"/>
    <path d="M 462 163 L 462 173 L 470 168 Z"/>
    <path d="M 592 163 L 592 173 L 600 168 Z"/>
  </g>
  <!-- 路线 B -->
  <rect x="60" y="260" width="130" height="56" rx="12" fill="url(#accent)"/>
  <text x="125" y="288" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">B 网盘 AI</text>
  <text x="125" y="306" font-size="11" fill="#cfe0ff" text-anchor="middle">不占本地</text>
  <g font-size="13" fill="#333b4d">
    <rect x="210" y="260" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="265" y="288" text-anchor="middle">网盘视频</text><text x="265" y="305" font-size="10.5" fill="#8a94a6" text-anchor="middle">本地可删</text>
    <rect x="340" y="260" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="395" y="288" text-anchor="middle">批量触发</text><text x="395" y="305" font-size="10.5" fill="#8a94a6" text-anchor="middle">挂机跑批</text>
    <rect x="470" y="260" width="110" height="56" rx="12" fill="#ffffff" stroke="#dfe5ef"/><text x="525" y="288" text-anchor="middle">AI 课件 PPT</text><text x="525" y="305" font-size="10.5" fill="#8a94a6" text-anchor="middle">生成并导出</text>
  </g>
  <rect x="600" y="260" width="130" height="56" rx="12" fill="url(#accent)"/>
  <text x="665" y="288" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">PPT · 讲稿 · 笔记</text>
  <text x="665" y="305" font-size="10.5" fill="#cfe0ff" text-anchor="middle">全部导出</text>
  <g stroke="#8a94a6" stroke-width="1.6" fill="none">
    <path d="M 324 288 L 332 288"/>
    <path d="M 454 288 L 462 288"/>
    <path d="M 584 288 L 592 288"/>
  </g>
  <g fill="#8a94a6">
    <path d="M 332 283 L 332 293 L 340 288 Z"/>
    <path d="M 462 283 L 462 293 L 470 288 Z"/>
    <path d="M 592 283 L 592 293 L 600 288 Z"/>
  </g>
  <!-- 终点卡片（右侧） -->
  <rect x="760" y="140" width="120" height="176" rx="14" fill="url(#accent)"/>
  <text x="820" y="214" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">考前一天的</text>
  <text x="820" y="242" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">复习提纲</text>
  <rect x="782" y="258" width="76" height="1" fill="#ffffff" opacity="0.25"/>
  <text x="820" y="284" font-size="10.5" fill="#cfe0ff" text-anchor="middle">txt · PPT · 笔记</text>
  <!-- 直连箭头 -->
  <g stroke="#2f5fb8" stroke-width="2" fill="none">
    <path d="M 734 168 L 754 168"/>
    <path d="M 734 288 L 754 288"/>
  </g>
  <path d="M 754 163 L 754 173 L 760 168 Z" fill="#2f5fb8"/>
  <path d="M 754 283 L 754 293 L 760 288 Z" fill="#2f5fb8"/>
</svg>
