  <rect x="676" y="382" width="124" height="34" rx="17" fill="#2f5fb8"/>
  <text x="738" y="404" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">PPT / 讲稿 / 笔记</text>
  <!-- 汇合 -->
  <g stroke="#2f5fb8" stroke-width="2.2" fill="none">
    <path d="M 738 242 C 738 266 700 266 700 286"/>
    <path d="M 738 416 C 738 440 700 440 700 460"/>
    <path d="M 700 286 C 700 440 700 440 700 460"/>
