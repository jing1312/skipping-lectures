name: Validate Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Skill
        run: python tests/validate_skill.py

      - name: Test Bash installer
        shell: bash
        run: |
          destination="$RUNNER_TEMP/skipping-skills-bash"
          bash scripts/install.sh --target custom --destination "$destination"
          test -f "$destination/skipping-lectures/SKILL.md"
          test -f "$destination/skipping-lectures/references/troubleshooting.md"

      - name: Test PowerShell installer
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "skipping-skills-pwsh"
          ./scripts/install.ps1 -Target custom -Destination $destination
          if (-not (Test-Path (Join-Path $destination "skipping-lectures/SKILL.md"))) {
            throw "first install missing SKILL.md"
          }
